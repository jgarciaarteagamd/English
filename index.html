/* Clases en audio B1. Cada lección: theory (guion), drills, chunks, vocab. Formato del guion: ver README («Formato de los guiones de audio»). */
window.AUDIO = window.AUDIO || {};

window.AUDIO['b1-present'] = {
topic:'la rutina diaria, el trabajo y la vida en Inglaterra',
theory:`
~ intro
T: ¡Hola, hola! ¿Qué tal? Bienvenido a tu clase en audio de Ruta al C2. Soy tu profesor, y hoy vamos a trabajar una de las lecciones más importantes de todo el inglés: el present simple y el present continuous.
T: Te cuento cómo funciona. Yo te explico todo en español, con calma, y cada ejemplo en inglés lo vas a escuchar en la voz de un nativo británico, muchas veces primero despacio y después a velocidad normal. Luego viene una pausa: repite la frase en voz alta, aunque vayas en el carro o estés en el gimnasio. Repetir en voz alta es lo que hace que la gramática se quede en tu cabeza.
T: También te haré preguntas: te digo una frase en español, la dices en inglés durante la pausa y después escuchas la respuesta correcta. ¿Listo? ¡Vamos allá!

## La gran idea: el inglés tiene dos presentes
T: Empecemos por la idea más importante de toda la lección. En español usamos el presente para casi todo. Si digo «trabajo en un hospital», es algo permanente. Si digo «hoy trabajo desde casa», es algo temporal. Y si te pregunto «¿qué haces?», puede significar «¿a qué te dedicas?» o «¿qué estás haciendo ahora mismo?». El español no nos obliga a elegir.
T: El inglés, en cambio, sí nos obliga. Tiene dos presentes. El present simple, para lo habitual, lo permanente y lo que siempre es verdad. Y el present continuous, para lo que está pasando ahora o es temporal. Escucha la diferencia.
R: She works in a hospital.
T: Ella trabaja en un hospital. Es su trabajo, algo estable.
R: She's working from home today.
T: Hoy está trabajando desde casa. Es temporal: solo hoy.
T: Quédate con esta pregunta, porque la vas a usar toda la vida. ¿Es un hábito o algo permanente? Present simple. ¿Está pasando ahora o es temporal? Present continuous.

## Primera parte: el present simple
### Cómo se forma
T: El present simple es muy fácil de formar. En la afirmativa usamos el verbo tal cual: I work, you work, we work, they work.
R: I work in an office.
T: Pero, ¡atención!, aquí viene la regla que más se olvida. Con he, she e it, es decir, con la tercera persona del singular, el verbo lleva una ese al final. Él trabaja: he works. Ella vive: she lives. Funciona: it works.
R: He works in a bank.
R: My sister lives in London.
T: Algunos verbos no añaden solo una ese, sino la terminación «e ese». Pasa con go y do, y con los verbos que terminan en un sonido silbante, como watch, finish o kiss. Go se convierte en goes. Watch, en watches.
R: She goes to the gym every morning.
E: He watches the news after dinner.
T: Y si el verbo termina en consonante más «y griega», la «y» cambia a «i» y añadimos «e ese». Study se convierte en studies. Pero si antes de la «y» hay una vocal, solo añadimos la ese: play, plays.
E: She studies English at night.
E: My son plays football on Saturdays.
T: Un verbo irregular muy importante: have se convierte en has con he, she e it.
E: He has two children.
T: Repite conmigo la regla de oro: con he, she e it, el verbo lleva ese.
R: He works. She lives. It costs.

### La negativa y las preguntas
T: Para la negativa necesitamos un ayudante: el auxiliar do. Usamos don't con I, you, we y they, y doesn't con he, she e it. Y aquí está el truco: cuando usamos doesn't, el verbo pierde la ese, porque la ese ya está en doesn't.
R: I don't eat meat.
R: She doesn't drink coffee.
T: Fíjate bien: she doesn't drink. Nunca she doesn't drinks. La ese aparece una sola vez.
T: Para preguntar, ponemos do o does delante del sujeto, y el verbo vuelve a su forma base, sin ese.
R: Do you live near here?
R: Does he speak Spanish?
T: Y las respuestas cortas se hacen con el mismo auxiliar.
E: Yes, I do.
E: No, he doesn't.
T: Ahora tú. Te hago la pregunta y respondes en la pausa.
Q: ¿Cómo dirías: «Ella no trabaja los lunes»? | She doesn't work on Mondays.
Q: ¿Y: «¿Tu hermano vive en Miami?»? | Does your brother live in Miami?
Q: ¿Y: «Nosotros no vemos mucha televisión»? | We don't watch much TV.

### Para qué se usa
T: Ahora, ¿cuándo usamos el present simple? Tiene cuatro usos principales. Vamos uno por uno.
T: Uno: hábitos y rutinas. Cosas que haces con frecuencia.
R: I get up at seven every day.
E: We go to the beach on Sundays.
T: Dos: verdades generales y hechos científicos. Cosas que siempre son verdad.
R: Water boils at a hundred degrees.
E: The sun rises in the east.
T: Tres: situaciones permanentes. Dónde vives, a qué te dedicas, cómo eres.
E: My parents live in Caracas.
E: I work as a nurse.
T: Y cuatro, un uso que sorprende mucho: horarios y programas fijos, aunque hablen del futuro. Trenes, vuelos, películas, clases.
R: The train leaves at seven fifteen tomorrow.
E: The film starts at eight.
T: El tren sale mañana, o sea, es futuro. Pero como es un horario fijo, usamos present simple. Y escucha la palabra film: así dicen película en Inglaterra.

### Los adverbios de frecuencia
T: Con el present simple usamos muchísimo los adverbios de frecuencia. Escúchalos, de más a menos frecuente.
R: always, usually, often, sometimes, rarely, never.
T: Always es siempre. Usually, normalmente. Often, a menudo. Sometimes, a veces. Rarely, casi nunca. Y never, nunca.
T: Ahora la regla de posición, que es justo donde fallamos los hispanohablantes. El adverbio va antes del verbo principal.
R: I usually get up at seven.
T: No lo pongas después del verbo, como hacemos en español con «me levanto normalmente». En inglés va antes: I usually get up.
T: Pero hay una excepción: con el verbo to be, el adverbio va después.
R: She is always late.
T: Y con los auxiliares, como have o can, también va después del auxiliar.
E: We have never met.
E: I can sometimes work from home.
T: Resumiendo: antes del verbo normal, y después de be y de los auxiliares. Vamos a practicarlo.
Q: Di en inglés: «Normalmente desayuno a las ocho». | I usually have breakfast at eight.
Q: Y ahora: «Él siempre está cansado». | He's always tired.
Q: Y esta: «Casi nunca como comida rápida». | I rarely eat fast food.

## Segunda parte: el present continuous
### Cómo se forma
T: Vamos con el segundo presente. El present continuous se forma con el verbo to be, es decir, am, is o are, más el verbo con la terminación ing.
T: I am working. You are working. He is working. En la conversación casi siempre usamos contracciones: I'm, you're, he's, she's, we're, they're.
R: I'm reading a great book at the moment.
R: They're watching a film.
T: La negativa es facilísima: añadimos not después de am, is o are.
E: I'm not working today.
E: She isn't listening.
T: Y para preguntar, ponemos am, is o are delante del sujeto.
R: Are you working this weekend?
R: What are you doing?
T: Un detalle de ortografía. Si el verbo termina en e, la e desaparece: make, making. Y en verbos cortos que terminan en consonante, vocal, consonante, doblamos la última letra: run, running. Sit, sitting.
E: The kids are running in the park.

### Para qué se usa
T: El present continuous tiene cinco usos. Pon atención, porque aquí está la clave de la lección.
T: Uno: acciones que están pasando ahora mismo, en este momento.
R: Look! It's raining.
E: Shh! The baby is sleeping.
T: Dos: situaciones temporales. No necesariamente en este segundo, sino en esta etapa de tu vida.
R: They're living with friends until they find a flat.
T: Están viviendo con unos amigos hasta que encuentren apartamento. Fíjate en la palabra flat: así dicen apartamento en Inglaterra.
E: I'm taking driving lessons this month.
T: Tres: tendencias y cambios. Cosas que están cambiando poco a poco.
R: Prices are rising fast.
E: Your English is getting better and better.
T: Cuatro: planes futuros ya organizados, con fecha, con hora o con otra persona.
R: I'm meeting Sarah tomorrow at six.
T: Me voy a ver con Sarah mañana a las seis. Ya está acordado.
E: We're flying to Madrid on Friday.
T: Y cinco: quejas con always. Cuando algo que se repite nos molesta, usamos always con el present continuous. Imagínate con cara de fastidio.
R: He's always leaving his socks on the floor!
E: You're always interrupting me!
T: Ahora tú.
Q: Di en inglés: «¡Mira, está nevando!». | Look! It's snowing.
Q: Ahora: «Este mes estoy trabajando desde casa». | I'm working from home this month.
Q: Y un plan ya organizado: «Voy a cenar con mis padres el sábado». | I'm having dinner with my parents on Saturday.

## Tercera parte: los verbos de estado
T: Y ahora, la parte que separa a un estudiante intermedio de uno avanzado: los verbos de estado. En inglés se llaman stative verbs.
T: Hay verbos que no describen acciones, sino estados: lo que piensas, lo que sientes, lo que tienes. Y estos verbos normalmente no se usan en continuous, aunque hablemos de ahora mismo.
T: Vamos por grupos. Primero, los verbos de la mente: know, believe, understand, remember, forget y mean.
R: I know the answer.
T: Nunca digas I'm knowing. Aunque sea ahora mismo, se dice I know.
E: I don't understand this question.
T: Segundo grupo: gustos y deseos. Like, love, hate, prefer, want y need.
R: I want a coffee, please.
T: Nada de I'm wanting. Siempre I want.
E: She needs a new phone.
T: Tercer grupo: posesión. Have, cuando significa tener, own y belong.
R: This bag belongs to me.
T: Y otros muy comunes: be, cost, seem y depend.
E: It depends on the weather.
E: That jacket costs too much.

### Verbos con doble significado
T: Subimos un nivel. Algunos verbos son de estado con un significado y de acción con otro. Los tres más importantes son think, have y taste.
T: Think. Cuando significa opinar o creer, es un estado: present simple.
R: I think you're right.
T: Pero cuando significa estar pensando, darle vueltas a algo, es una acción: present continuous.
R: I'm thinking about moving abroad.
T: Have. Cuando significa tener, poseer, va en present simple.
E: She has two brothers.
T: Pero cuando have forma parte de una actividad, como comer, bañarse o pasarla bien, sí puede ir en continuous.
R: She's having lunch.
E: We're having a great time!
T: Y taste. «La sopa sabe buenísima» es un estado.
E: This soup tastes great.
T: Pero «el chef está probando la sopa» es una acción.
E: The chef is tasting the soup.
Q: Di en inglés: «Creo que es una buena idea». | I think it's a good idea.
Q: Ahora: «Estoy pensando en cambiar de trabajo». | I'm thinking about changing jobs.
Q: Y esta: «No necesito ayuda, gracias». | I don't need any help, thanks.

## Trampas para hispanohablantes
T: Llegamos a mi parte favorita: las trampas en las que caemos los hispanohablantes. Escucha con atención, porque estos errores se oyen muchísimo.
T: Trampa número uno: olvidar la ese de la tercera persona. Decir «she work» o «he live». Es el error más común, incluso en niveles altos. Repite la forma correcta.
R: She works. He lives. It costs.
T: Trampa número dos: el famoso «¿qué haces?». Si quieres saber a qué se dedica alguien, pregunta así.
R: What do you do?
T: Pero si quieres saber qué está haciendo en este momento, pregunta así.
R: What are you doing?
T: Si le preguntas a alguien «what do you do?» esperando que te diga «estoy cocinando», te va a contestar «soy ingeniero». ¡Cuidado con esa!
T: Trampa número tres: usar el continuous con verbos de estado, porque a veces en español decimos «estoy queriendo» o «estoy entendiendo». En inglés no: I know, I want, I need, I understand.
T: Trampa número cuatro: usar el presente para decir desde cuándo haces algo. En español decimos «vivo aquí desde dos mil diecinueve». En inglés eso no se dice con present simple, sino con present perfect.
R: I've lived here since 2019.
T: Lo veremos a fondo en otra lección. Pero desde ya: nunca digas «I live here since».
T: Y trampa número cinco: la posición de los adverbios. El adverbio de frecuencia va antes del verbo.
R: I usually go to the gym.

## Práctica final: ¿simple o continuous?
T: Vamos a poner todo a prueba. Te digo una frase en español. Piensa: ¿hábito o ahora? ¿Permanente o temporal? Y dila en inglés durante la pausa.
Q: «Mi papá trabaja en un banco». | My dad works in a bank.
Q: «Ahora mismo mi papá está trabajando en el jardín». | My dad is working in the garden right now.
Q: «No entiendo lo que dices». | I don't understand what you're saying.
Q: «¿Qué estás haciendo?». | What are you doing?
Q: «¿A qué te dedicas?». | What do you do?
Q: «El agua hierve a cien grados». | Water boils at a hundred degrees.
Q: «Este año estoy estudiando muchísimo». | I'm studying really hard this year.
Q: «Ella casi nunca come carne». | She rarely eats meat.
Q: Con fastidio: «¡Siempre estás perdiendo las llaves!». | You're always losing your keys!
Q: «La película empieza a las nueve». | The film starts at nine.

## Resumen final
T: ¡Excelente trabajo! Repasemos lo más importante.
T: El present simple es para hábitos, verdades, situaciones permanentes y horarios. Con he, she e it, el verbo lleva ese. Para negar y preguntar usamos do y does, y el verbo vuelve a su forma base.
R: She works in a hospital.
T: El present continuous se forma con am, is o are, más el verbo con ing. Es para lo que pasa ahora, lo temporal, las tendencias, los planes ya organizados y las quejas con always.
R: She's working from home today.
T: Los verbos de estado, como know, want, need, like y belong, normalmente no van en continuous. Y algunos, como think, have y taste, cambian de significado.

const CONTR = [[/\b(did|do|does|is|are|was|were|have|has|had|could|should|would|must|need)nt\b/g,"$1n't"],[/\bwont\b/g,"won't"],[/\bcant\b/g,"can't"],[/\bim\b/g,"i'm"],[/\bive\b/g,"i've"],[/\bwon't\b/g,'will not'],[/\bcan't\b/g,'cannot'],[/\bshan't\b/g,'shall not'],[/\bain't\b/g,'is not'],[/n't\b/g,' not'],[/'re\b/g,' are'],[/'ve\b/g,' have'],[/'ll\b/g,' will'],[/\bi'm\b/g,'i am'],[/\bcan not\b/g,'cannot'],[/\blet's\b/g,'let us']];
function base(s) {
  s = String(s || '').toLowerCase().replace(/[’‘`´]/g, "'").replace(/[“”«»]/g, '"').replace(/[—–]/g, '-');
  s = s.replace(/["()¿¡]/g, ' ');
  for (const [r, v] of CONTR) s = s.replace(r, v);
  s = s.replace(/[.,!?;:/]/g, ' ').replace(/\s+/g, ' ').trim();
  s = s.replace(/\b([a-z]{2,})iz(e|ed|es|ing|ation|ations)\b/g, '$1is$2').replace(/\b([a-z]{2,})yz(e|ed|es|ing)\b/g, '$1ys$2');
  s = s.replace(/\b(colo|favo|behavio|neighbo|hono|humo|labo|flavo)r(s|ed|ing|ite|ites)?\b/g, (m, a, b) => a + 'ur' + (b || ''));
  s = s.replace(/\b(travel|cancel|model|label|signal|fuel|level|counsel)l(ed|ing|er|ers)\b/g, '$1$2');
  return s;
}
function variants(s) {
  let out = [base(s)];
  const amb = [[/\b([a-z]+)'d\b/g, ['$1 would', '$1 had']], [/\b(it|he|she|that|what|there|here|who|where|how|everything|nobody|everyone)'s\b/g, ['$1 is', '$1 has']]];
  for (const [re, reps] of amb) {
    const next = [];
    for (const v of out) { if (v.search(re) >= 0) reps.forEach(r => next.push(v.replace(re, r))); else next.push(v); re.lastIndex = 0; }
    out = next;
  }

}

function matches(user, answers) {
  const u = base(user);
  if (answers.includes('-') && NONE_WORDS.includes(u)) return true;
  const uv = variants(user);
  return answers.some(a => { const av = variants(a); return uv.some(x => av.includes(x)); });
}

   ========================================================= */
const CALL_LABEL = {trap:'Trampa para hispanohablantes', tip:'Consejo', note:'Nota'};
function inl(s) {
  let h = esc(s);

}
const plain = s => String(s || '').replace(/\*\*|`/g, '').replace(/(^|\s)\*([^*]+)\*/g, '$1$2');
function splitPipe(s) { const i = s.indexOf(' | '); if (i < 0) return [s.replace(/\s*\|\s*$/, ''), '']; return [s.slice(0, i), s.slice(i + 3)]; }

function renderMarkup(src) {
  const lines = String(src || '').replace(/\r/g, '').split('\n');
  let html = '', i = 0, para = []; const toc = [];
  const flush = () => { if (para.length) { html += '<p>' + inl(para.join(' ')) + '</p>'; para = []; } };
  const starts = (p) => i < lines.length && lines[i].trim().startsWith(p);
  while (i < lines.length) {
    const line = lines[i].trim();
    if (!line) { flush(); i++; continue; }
    if (line.startsWith('## ')) { flush(); const id = 'sec' + toc.length; toc.push({id, t:plain(line.slice(3))}); html += `<h2 id="${id}">${inl(line.slice(3))}</h2>`; i++; continue; }
    if (line.startsWith('### ')) { flush(); html += `<h3>${inl(line.slice(4))}</h3>`; i++; continue; }
    if (line.startsWith(':: ')) { flush(); html += `<div class="formula">${inl(line.slice(3))}</div>`; i++; continue; }
    if (line.startsWith('> ')) {
      flush(); let g = '';
      while (starts('> ')) { const [en, es] = splitPipe(lines[i].trim().slice(2)); g += `<div class="ex">${speakBtn(en) || '<span></span>'}<div><p class="en">${inl(en)}</p>${es ? `<p class="es">${inl(es)}</p>` : ''}</div></div>`; i++; }
      html += `<div class="exs">${g}</div>`; continue;
    }
    if (line.startsWith('x> ')) {
      flush(); let g = '';
      while (starts('x> ')) { const [no, yes] = splitPipe(lines[i].trim().slice(3)); g += `<div class="wrong"><div class="no"><b>✗</b><span>${inl(no)}</span></div><div class="yes"><b>✓</b><span>${inl(yes)}</span></div></div>`; i++; }
      html += `<div class="wrongs">${g}</div>`; continue;
    }
    const cm = line.match(/^!(trap|tip|note):\s*(.*)$/);
    if (cm) { flush(); html += `<div class="call ${cm[1]}"><span class="lbl">${CALL_LABEL[cm[1]]}</span><p>${inl(cm[2])}</p></div>`; i++; continue; }
    if (line.startsWith('|')) {

      if (rows.length) html += `<div class="tbl"><table><thead><tr>${rows[0].map(c => `<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r => `<tr>${r.map(c => `<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      continue;
    }

/* Markdown sencillo para respuestas de la IA */
function md(src) {
  const lines = String(src || '').replace(/\r/g, '').split('\n');
  let html = '', list = null, para = [];
  const flushP = () => { if (para.length) { html += '<p>' + inl(para.join(' ')) + '</p>'; para = []; } };
  const flushL = () => { if (list) { html += `<${list.t}>${list.items.map(x => '<li>' + inl(x) + '</li>').join('')}</${list.t}>`; list = null; } };
  for (const raw of lines) {
    const l = raw.trim();
    if (!l) { flushP(); flushL(); continue; }
    let m;
    if ((m = l.match(/^#{1,4}\s+(.*)$/))) { flushP(); flushL(); html += `<h4>${inl(m[1])}</h4>`; continue; }
    if ((m = l.match(/^[-*•]\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ul') { flushL(); list = {t:'ul', items:[]}; } list.items.push(m[1]); continue; }
    if ((m = l.match(/^\d+[.)]\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ol') { flushL(); list = {t:'ol', items:[]}; } list.items.push(m[1]); continue; }
    flushL(); para.push(l);
  }
  flushP(); flushL();

}

/* ---------- Almacén de audios (IndexedDB) ---------- */
const IDB = (() => {
  let p = null;
  const open = () => p || (p = new Promise((res, rej) => {
    if (!window.indexedDB) { rej(new Error('idb')); return; }
    const r = indexedDB.open('rutaC2-audio', 1);
    r.onupgradeneeded = () => { const db = r.result; for (const s of ['seg', 'audio']) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => { p = null; rej(r.error); };
  }));
  const run = (store, mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction(store, mode), req = fn(t.objectStore(store));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }));
  return {
    get:(s, k) => run(s, 'readonly', st => st.get(k)),
    put:(s, k, v) => run(s, 'readwrite', st => st.put(v, k)),
    has:(s, k) => run(s, 'readonly', st => st.count(k)).then(n => n > 0),
    del:(s, keys) => run(s, 'readwrite', st => { for (const k of [].concat(keys)) st.delete(k); return null; })
  };
})();

async function uploadAudio(id) {

      }, rej, res);

}
async function fbSyncAudios() {
  const {fs, db} = FB.m, remote = {}, up = [];
  (await fs.getDocs(fs.collection(db, 'users', FB.user.uid, 'audio'))).forEach(d => { remote[d.id] = d.data(); });
  for (const [id, r] of Object.entries(remote)) {
    const l = AMETA[id];
    if (!l || (r.at || 0) > (l.at || 0)) {   // nuevo o regenerado en otro dispositivo
      if (l && l.local !== false) IDB.del('audio', id).catch(() => {});
      AMETA[id] = Object.assign({}, r, {cloud:true, local:false});
    } else if ((l.at || 0) > (r.at || 0)) up.push(id);
    else l.cloud = true;
  }
  for (const [id, l] of Object.entries(AMETA)) {
    if (id.split('|').length !== 2 || remote[id]) continue;
    if (l.cloud) { if (l.local === false) delete AMETA[id]; else l.cloud = false; }   // borrado desde otro dispositivo
    else if (l.cloud === undefined && l.local !== false) up.push(id);                // generado antes de entrar con tu cuenta
  }
  saveAMeta();
  for (const id of up) await uploadAudio(id);
}

/* =========================================================
   Motor de ejercicios
   ========================================================= */
const TYPE_LABEL = {mc:'Elige la opción correcta', gap:'Completa el hueco', fix:'Corrige el error', tr:'Transformación con palabra clave', ord:'Ordena las palabras'};
function mkItem(ex, key, lessonId, src) {
  const it = {ex, key, lessonId, src, done:false, correct:null, user:'', prev:null};
  if (ex.t === 'mc') it.perm = shuffle(ex.o.map((_, i) => i));
  if (ex.t === 'ord') { let w = shuffle(ex.w.map((x, i) => ({x, i}))); if (w.map(o => o.x).join(' ') === ex.w.join(' ') && w.length > 1) w = w.slice(1).concat(w[0]); it.words = w; }
  return it;
}
const itemsOf = l => l.ex.map((ex, i) => mkItem(ex, l.id + '#' + i, l.id, l.ai ? 'custom' : 'lesson'));
function startSession(cfg) {
  if (!cfg.items.length) { toast('No hay ejercicios disponibles para esta sesión.'); return; }
  SESSION = Object.assign({i:0, q:{sel:null, text:'', built:[]}, startedAt:Date.now(), xp:0, finished:false}, cfg);
  prepQ();
  go('quiz');
  focusAnswer();
}
function prepQ() { const it = SESSION.items[SESSION.i]; SESSION.q = {sel:null, text:it && it.ex.t === 'fix' ? it.ex.q : '', built:[]}; }
function startLesson(id) { const l = lessonById(id); if (!l) return; startSession({mode:'lesson', title:l.title, lessonId:id, items:itemsOf(l)}); }
function pickFrom(l, n, preferWrong = true) {
  const items = itemsOf(l);
  const wrong = preferWrong ? items.filter(it => S.mistakes.items[it.key] && !S.mistakes.items[it.key].resolved) : [];
  const rest = shuffle(items.filter(it => !wrong.includes(it)));
  return shuffle(wrong).concat(rest).slice(0, n);
}
function startReview() {
  const due = dueLessons();
  if (!due.length) { toast('No tienes repasos pendientes hoy.'); return; }
  const per = Math.max(3, Math.ceil(15 / due.length));
  let items = [];
  for (const l of due) items = items.concat(pickFrom(l, per));
  startSession({mode:'review', title:'Repaso espaciado', items:shuffle(items).slice(0, Math.max(15, due.length * 3)), lessons:due.map(l => l.id)});
}
function startMixed(level, count) {
  let pool = allLessons().filter(l => (level === 'all' || l.level === level) && lp(l.id) && lp(l.id).status === 'done');
  if (!pool.length) pool = level === 'all' ? levelLessons(workingLevel()) : levelLessons(level);
  let items = [];
  for (const l of pool) items = items.concat(itemsOf(l));
  startSession({mode:'mixed', title:'Repaso mixto' + (level === 'all' ? '' : ' ' + level), items:shuffle(items).slice(0, count)});
}
function startMistakes(filterLesson) {
  let ms = pendingMistakes().filter(m => m.ex && (!filterLesson || m.lesson === filterLesson));
  ms.sort((a, b) => (b.count - a.count) || (a.last - b.last));
  ms = ms.slice(0, 12);
  if (!ms.length) { toast('No tienes errores pendientes. ¡Buen trabajo!'); return; }
  startSession({mode:'mistakes', title:'Practica tus errores', items:shuffle(ms.map(m => mkItem(m.ex, m.k, m.lesson, m.src)))});
}
function startTest(L) {
  let items = [];
  for (const l of levelLessons(L)) {
    const ok = itemsOf(l).filter(it => it.ex.t !== 'ord');
    items = items.concat(shuffle(ok).slice(0, 2));
  }
  startSession({mode:'test', title:'Examen de nivel ' + L, level:L, items:shuffle(items)});
}

function checkCurrent(override) {
  const it = SESSION.items[SESSION.i], ex = it.ex, q = SESSION.q;
  let correct = false, user = '';
  if (ex.t === 'mc') { if (q.sel == null) return; user = ex.o[q.sel]; correct = q.sel === ex.a; }
  else if (ex.t === 'ord') { user = q.built.map(i => it.words[i].x).join(' '); if (!q.built.length) return; correct = matches(user, ex.a); }
  else {
    user = (q.text || '').trim(); if (!user) return;
    correct = matches(user, ex.a);
    if (!correct && ex.t === 'tr') correct = matches(user, ex.a.map(a => ex.s.replace(/_{3,}/, a)));
  }
  it.done = true; it.correct = correct; it.user = user;
  const a = act(); a.ex++; if (correct) a.ok++;
  const xp = correct ? 10 : 2; addXP(xp); SESSION.xp += xp;
  recordAnswer(it, correct, user);
  touch('progress', 'mistakes');
  render();
}
function overrideCorrect() {
  const it = SESSION.items[SESSION.i];
  if (!it || !it.done || it.correct) return;
  undoRecord(it); it.correct = true; it.overridden = true;
  const a = act(); a.ok++; addXP(8); SESSION.xp += 8;
  const M = S.mistakes.items[it.key];
  if (M && !M.resolved) { M.streak = (M.streak || 0) + 1; if (M.streak >= 2) { M.resolved = true; M.resolvedAt = Date.now(); } act().fixes++; }
  touch('progress', 'mistakes');
  render();
}
function nextQ() {
  if (SESSION.i < SESSION.items.length - 1) { SESSION.i++; prepQ(); render(); focusAnswer(); }
  else finishSession();
}
function finishSession() {
  const s = SESSION; s.finished = true;
  const total = s.items.length, ok = s.items.filter(x => x.correct).length;
  s.score = total ? Math.round(ok / total * 100) : 0;
  if (s.mode === 'lesson' || s.mode === 'ai') {

function startDeckQuiz(id) {

  const picks = shuffle(d.words).slice(0, 10);
  const items = picks.map((w, n) => {
    let ex;
    if (n % 2 === 0) {
      const others = shuffle(d.words.filter(x => x[0] !== w[0])).slice(0, 3).map(x => x[0]);
      const o = shuffle([w[0]].concat(others));
      ex = {t:'mc', q:`Which word or expression means: "${w[2] || w[3]}"?`, o, a:o.indexOf(w[0]), e:`${w[0]} = ${w[3]}. ${w[4] || ''}`.trim()};

      ex = {t:'gap', q:`En inglés: «${w[3]}» → ___`, a:ans.concat([w[0]]), e:`${w[4] || ''}`};
    }

  Gn.busy = false; render();
}

/* =========================================================
   Vista: Plan C2 y Ajustes
   ========================================================= */
function viewGuide() {
  return `${pageHead('Plan C2', 'Cómo llegar del B1 al C2: qué significa cada nivel, cuánto tiempo lleva, el método que funciona y una rutina concreta.')}
  ${GUIDE.map(g => { const {html} = renderMarkup(g.body); return `<details class="acc" ${UI.guideOpen === g.id ? 'open' : ''} data-gid="${g.id}"><summary>${esc(g.title)}${ic('right')}</summary><div class="theory">${html}</div></details>`; }).join('')}`;
}
function viewSettings() {
  const st = S.progress.settings;
  const segBtns = (act, key, opts) => `<span class="seg">${opts.map(([v, t]) => `<button data-act="${act}" data-v="${v}" aria-pressed="${String(st[key]) === String(v)}">${t}</button>`).join('')}</span>`;
  return `${pageHead('Ajustes', 'Personaliza tu ritmo de estudio y gestiona tu progreso.')}
  ${acctSettings()}
  <section class="panel stack"><h3>Ritmo</h3>
    <div class="stack" style="gap:6px"><b>Objetivo diario de XP</b>${segBtns('set-goal', 'goal', [[30, 'Ligero · 30'], [50, 'Normal · 50'], [80, 'Intenso · 80'], [120, 'Muy intenso · 120']])}<span class="small muted">Un ejercicio acertado da 10 XP; una tarjeta, 2 XP.</span></div>
    <div class="stack" style="gap:6px"><b>Palabras nuevas al día</b>${segBtns('set-new', 'newPerDay', [[5, '5'], [10, '10'], [15, '15'], [20, '20']])}</div>
    <div class="stack" style="gap:6px"><b>Nivel de partida</b>${segBtns('set-start', 'start', LEVELS.map(L => [L, L]))}<span class="small muted">Las recomendaciones empiezan en este nivel. Tu test indicó B1.</span></div>
  </section>
  <section class="panel stack"><h3>Pronunciación</h3>
    ${ttsOK ? `<div class="stack" style="gap:6px"><b>Acento de la voz</b>${segBtns('set-voice', 'voice', [['en-GB', 'Británico'], ['en-US', 'Americano']])}</div>
    <div class="stack" style="gap:6px"><b>Velocidad</b>${segBtns('set-rate', 'rate', [[0.8, 'Lenta'], [0.95, 'Normal'], [1.1, 'Rápida']])}</div>
    <button class="btn" data-act="say" data-say="The quick brown fox jumps over the lazy dog." style="align-self:flex-start">${ic('speaker')}Probar la voz</button>` : '<p class="muted">Tu navegador no ofrece voz sintética.</p>'}
  </section>
  ${elSettings()}
  <section class="panel stack"><h3>Copia de seguridad</h3>
    <p class="small muted">${sync === 'cloud' ? 'Tu progreso se guarda automáticamente en tu cuenta y en este navegador.' : 'Tu progreso se guarda en este navegador. Copia una copia de seguridad para llevarla a otro dispositivo.'}</p>
    <div class="row"><button class="btn" data-act="export">${ic('copy')}Copiar mi progreso</button></div>
    <label class="field">Restaurar desde una copia<textarea id="importbox" rows="3" placeholder="Pega aquí tu copia de seguridad">${esc(UI.importText)}</textarea></label>
    <div class="row"><button class="btn" data-act="import">Restaurar</button>${UI.importMsg ? `<span class="small">${esc(UI.importMsg)}</span>` : ''}</div>
  </section>
  <section class="panel stack"><h3>Empezar de cero</h3>
    ${UI.confirmReset ? `<div class="confirm"><b>¿Seguro? Se borrará todo tu progreso, errores y tarjetas.</b><div class="row"><button class="btn danger" data-act="reset-yes">Sí, borrar todo</button><button class="btn" data-act="reset-no">Cancelar</button></div></div>` : `<button class="btn danger" data-act="reset" style="align-self:flex-start">${ic('trash')}Borrar mi progreso</button>`}
  </section>`;
}
function viewAudio() {
  const ls = GRAMMAR.filter(l => AUDIO[l.id]);
  const made = Object.keys(AMETA).filter(k => k.split('|').length === 2).length;
  return `${pageHead('Clases en audio', 'Teoría, refuerzo con frases nativas y vocabulario de cada lección, para escuchar mientras conduces o entrenas.')}
  <section class="panel stack"><div class="row between"><h3>Tu cuenta de ElevenLabs</h3><span data-credits>${creditsChip()}</span></div>
    ${EL.key ? `<p class="small muted">Modelo <b>${esc(elModel().name)}</b> · profesor: <b>${esc(voiceName('teacher', EL.teacher))}</b> · nativo: <b>${esc(voiceName('native', EL.native))}</b></p>` : '<p class="small">Aún no has añadido tu clave de ElevenLabs.</p>'}
    <p class="small muted">${plural(made, 'audio generado', 'audios generados')} · guiones listos en ${ls.length} de ${GRAMMAR.length} lecciones. ${fbIn() ? 'Los audios se guardan en tu nube: puedes escucharlos desde cualquier dispositivo donde entres con tu cuenta.' : 'Los audios se guardan en este navegador; descárgalos o entra con tu cuenta de Google para tenerlos en todos tus dispositivos.'}</p>
    <div class="row"><button class="btn sm" data-act="el-setup">${ic('gear')}Ajustes de audio</button>${!fbIn() && !inClaude() ? '<button class="btn sm" data-act="fb-in">Entrar con Google</button>' : ''}</div></section>
  ${ls.map(l => `<section class="panel stack"><div class="row between"><div class="row" style="gap:8px">${lvChip(l.level)}<b>${esc(l.title)}</b></div><button class="btn sm ghost" data-act="open-lesson" data-id="${esc(l.id)}">Abrir lección${ic('right')}</button></div><div class="arows">${Object.keys(AKINDS).map(k => audioRow(l, k)).join('')}</div></section>`).join('')}
  ${ls.length < GRAMMAR.length ? '<div class="empty">Las demás lecciones tendrán sus guiones más adelante. Cuando quieras más, pídele a Claude: «escribe los guiones de audio de las lecciones …».</div>' : ''}`;
}
function viewMore() {
  return `${pageHead('Más', '')}<div class="sheet">${['mistakes', 'audio', 'tutor', 'guide', 'settings'].map(id => NAV.find(n => n.id === id)).map(n => `<button data-act="nav" data-to="${n.id}">${ic(n.icon)}<span style="flex:1">${n.label}</span>${navBadge(n.id)}</button>`).join('')}</div><div class="sync" id="sync2"></div>`;
}

/* =========================================================
   Render principal
   ========================================================= */
const VIEWS = {home:viewHome, grammar:viewGrammar, lesson:viewLesson, quiz:viewQuiz, review:viewReview, mistakes:viewMistakes, vocab:viewVocab, deck:viewDeck, flash:viewFlash, tutor:viewTutor, audio:viewAudio, guide:viewGuide, settings:viewSettings, more:viewMore};
function render() {
  const v = $('#view'); if (!v) return;
  const fn = VIEWS[R.name] || viewHome;
  let html;
  try { html = fn(); } catch (e) { console.error(e); html = `<div class="empty">Algo ha fallado al mostrar esta sección.</div><button class="btn" data-act="nav" data-to="home">Volver al inicio</button>`; }
  v.innerHTML = html;
  renderNav();
  const s2 = $('#sync2'); if (s2) { s2.className = 'sync' + (sync === 'cloud' ? ' on' : ''); s2.innerHTML = $('#sync') ? $('#sync').innerHTML : ''; }
  if (R.name === 'lesson' && R.p.id && (R.p.tab || 'theory') === 'theory') { const p = ensureLp(R.p.id); if (!p.theory) { p.theory = true; touch('progress'); } }
}

/* =========================================================
   Eventos
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  switch (a) {
    case 'nav': if (d.to === 'flash') startFlash(); else go(d.to); break;
    case 'back': back(R.name === 'lesson' ? 'grammar' : R.name === 'deck' ? 'vocab' : 'home'); break;
    case 'say': speak(d.say); break;
    case 'toc': { e.preventDefault(); const t = document.getElementById(d.id); if (t) t.scrollIntoView({behavior:'smooth', block:'start'}); break; }
    case 'open-lesson': go('lesson', {id:d.id, tab:'theory'}); break;
    case 'open-level': UI.grammarLevel = d.lv; UI.grammarQuery = ''; go('grammar', {level:d.lv}); break;
    case 'ltab': R.p = Object.assign({}, R.p, {tab:d.tab}); render(); break;
    case 'glevel': UI.grammarLevel = d.lv; UI.grammarQuery = ''; render(); break;
    case 'start-lesson': startLesson(d.id); break;
    case 'start-lesson-mistakes': startMistakes(d.id); break;
    case 'start-review': startReview(); break;
    case 'start-mixed': startMixed(d.lv || 'all', UI.reviewCount); break;
    case 'start-mistakes': startMistakes(); break;
    case 'start-test': startTest(d.lv); break;
    case 'start-flash': startFlash(); break;
    case 'set-start': S.progress.settings.start = d.lv || d.v; UI.grammarLevel = null; touch('progress'); render(); break;
    case 'pick': if (SESSION && !SESSION.items[SESSION.i].done) { SESSION.q.sel = Number(d.i); render(); } break;
    case 'build': if (SESSION) { SESSION.q.built.push(Number(d.i)); render(); } break;
    case 'unbuild': if (SESSION) { SESSION.q.built.splice(Number(d.n), 1); render(); } break;
    case 'check': checkCurrent(); break;
    case 'next': nextQ(); break;
    case 'override': overrideCorrect(); break;
    case 'quit': { const s = SESSION; SESSION = null; if (s && s.lessonId) go('lesson', {id:s.lessonId, tab:'practice'}, false); else back(); break; }
    case 'retry-wrong': { const s = SESSION; const items = s.items.filter(x => !x.correct).map(x => mkItem(x.ex, x.key, x.lessonId, x.src)); startSession({mode:'retry', title:'Repite tus fallos', lessonId:s.lessonId, items}); break; }
    case 'rlevel': UI.reviewLevel = d.lv; render(); break;
    case 'rcount': UI.reviewCount = Number(d.n); render(); break;
    case 'mfilter': UI.mistFilter = d.f; render(); break;
    case 'del-mistake': delete S.mistakes.items[d.k]; touch('mistakes'); render(); break;
    case 'explain': explainMistake(d.k); break;
    case 'vlevel': UI.vocabLevel = d.lv; render(); break;
    case 'deck-study': startFlash(d.id); break;
    case 'deck-quiz': startDeckQuiz(d.id); break;
    case 'open-deck': go('deck', {id:d.id}); break;
    case 'reveal': if (FLASH) { FLASH.revealed = true; render(); } break;
    case 'grade': gradeFlash(Number(d.g)); break;
    case 'fdir': if (FLASH) { FLASH.dir = d.d; S.progress.settings.dir = d.d; FLASH.revealed = false; touch('progress'); render(); } break;
    case 'quit-flash': FLASH = null; go('vocab', {}, false); break;
    case 'add-word': {
      const w = ($('#mw-w') || {}).value || '', es = ($('#mw-es') || {}).value || '', ex = ($('#mw-ex') || {}).value || '';
      if (!w.trim() || !es.trim()) { toast('Escribe la palabra y su significado.'); break; }
      if (S.vocab.mine.some(x => x.w.toLowerCase() === w.trim().toLowerCase())) { toast('Esa palabra ya está en tu lista.'); break; }
      S.vocab.mine.push({w:w.trim().slice(0, 80), es:es.trim().slice(0, 120), ex:ex.trim().slice(0, 200), p:'', d:''}); touch('vocab'); toast('Palabra añadida a «Mis palabras»'); render(); break;
    }
    case 'del-word': { const d0 = deckById('mine'); const w = d0.words[Number(d.i)]; if (w) { S.vocab.mine.splice(Number(d.i), 1); delete S.vocab.cards[cardKey('mine', w[0])]; touch('vocab'); render(); } break; }
    case 'ttab': UI.tutorTab = d.t; render(); break;
    case 'wlevel': AI.write.level = d.lv; render(); break;
    case 'wprompt': { const lv = AI.write.level || workingLevel(); AI.write.prompt = WRITING_PROMPTS[lv][Number(d.i)]; render(); const t = $('#wtext'); if (t) t.focus(); break; }
    case 'wcheck': runWritingCheck(); break;
    case 'wstop': if (AI.write.ctl) AI.write.ctl.abort(); break;
    case 'chat-send': chatSend(); break;
    case 'chat-stop': if (AI.chat.ctl) AI.chat.ctl.abort(); break;
    case 'chat-clear': AI.chat.turns = []; AI.chat.err = ''; render(); break;
    case 'ask-tutor': { const l = lessonById(d.id); UI.tutorTab = 'chat'; AI.chat.draft = l ? `Tengo una duda sobre "${l.title}": ` : ''; go('tutor'); setTimeout(() => { const t = $('#chatin'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }, 40); break; }
    case 'glvl': AI.gen.level = d.lv; render(); break;
    case 'gen-lesson': genLesson(); break;
    case 'gen-extra': genExtra(d.id); break;
    case 'set-goal': S.progress.settings.goal = Number(d.v); touch('progress'); render(); break;
    case 'set-new': S.progress.settings.newPerDay = Number(d.v); touch('progress'); render(); break;
    case 'set-voice': S.progress.settings.voice = d.v; touch('progress'); render(); break;
    case 'set-rate': S.progress.settings.rate = Number(d.v); touch('progress'); render(); break;
    case 'export': {
      const txt = JSON.stringify({app:'ruta-c2', v:1, exportedAt:new Date().toISOString(), state:S});
      const done = () => toast('Copia de seguridad copiada al portapapeles');
      const fallback = () => { UI.importText = txt; UI.importMsg = 'Selecciona y copia el texto del cuadro.'; render(); const b = $('#importbox'); if (b) { b.focus(); b.select(); } };
      try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (err) { fallback(); }
      break;
    }
    case 'import': {
      const raw = ($('#importbox') || {}).value || '';
      try { const o = JSON.parse(raw); const st = o && o.state ? o.state : o; if (!st || !st.progress) throw new Error('x'); S = hydrate(st); touch(...SECTIONS); UI.importText = ''; UI.importMsg = 'Progreso restaurado.'; render(); }
      catch (err) { UI.importMsg = 'Ese texto no es una copia de seguridad válida. Usa «Copiar mi progreso» para obtener una.'; render(); }
      break;
    }
    case 'aud-gen': case 'aud-sample': { const [lid, kind] = d.id.split('|'); generateAudio(lid, kind, a === 'aud-sample'); break; }
    case 'aud-stop': { const g = GEN[d.id]; if (g) g.ctl.abort(); break; }
    case 'aud-play': playAudio(d.id); break;
    case 'aud-dl': downloadAudio(d.id); break;
    case 'aud-share': shareAudio(d.id); break;
    case 'aud-script': UI.scriptOpen = UI.scriptOpen === d.id ? null : d.id; render(); break;
    case 'aud-ask': UI.audConfirm = {id:d.id, what:d.w}; render(); break;
    case 'aud-no': UI.audConfirm = null; render(); break;
    case 'aud-yes': {
      const c = UI.audConfirm; UI.audConfirm = null;
      if (!c) break;
      deleteAudio(c.id).then(ok => { if (!ok) { render(); return; } if (c.what === 'regen') { const [lid, kind] = c.id.split('|'); generateAudio(lid, kind); } else { toast('Audio borrado'); render(); } });
      break;
    }
    case 'pl-close': closePlayer(); break;
    case 'aud-up': uploadAudio(d.id); break;
    case 'fb-in': fbSignIn(); break;
    case 'fb-out': fbSignOut(); break;
    case 'fb-sync': if (DB && DB.fb) { sync = 'syncing'; renderSync(); flushSync().then(() => pullCloud(false)).then(fbRefresh).then(() => toast('Sincronizado'), e => { sync = 'error'; syncErr = fbMsg(e); render(); }); } break;
    case 'el-setup': openElSettings(); break;
    case 'el-save': { const v = (($('#el-key') || {}).value || '').trim(); EL.key = v; saveEL(); UI.elMsg = v ? 'Comprobando…' : ''; render(); if (v) elRefreshSub(true); break; }
    case 'el-forget': EL.key = ''; ELSUB = null; UI.elMsg = 'Clave eliminada de este navegador.'; saveEL(); render(); break;
    case 'el-model': EL.model = d.v; saveEL(); render(); break;
    case 'el-pause': EL.pause = Number(d.v); saveEL(); render(); break;
    case 'el-music': EL.music = d.v === '1'; saveEL(); render(); break;
    case 'el-design': designVoice(); break;
    case 'el-design-save': saveDesigned(Number(d.i)); break;
    case 'el-voices': loadMyVoices(); break;
    case 'el-test': testVoices(); break;
    case 'el-custom': { const v = (($('#el-custom') || {}).value || '').trim(); if (!/^[A-Za-z0-9]{10,40}$/.test(v)) { toast('Pega un Voice ID válido de ElevenLabs.'); break; } EL[d.role] = v; saveEL(); toast('Voz actualizada'); render(); break; }
    case 'reset': UI.confirmReset = true; render(); break;
    case 'reset-no': UI.confirmReset = false; render(); break;
    case 'reset-yes': { const keep = S.progress.settings; S = blank(); S.progress.settings = keep; UI.confirmReset = false; touch(...SECTIONS); toast('Progreso borrado'); go('home'); break; }
  }
});
document.addEventListener('toggle', e => { const d = e.target; if (d && d.matches && d.matches('details[data-gid]') && d.open) UI.guideOpen = d.dataset.gid; }, true);
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ans' && SESSION) {
    SESSION.q.text = t.value;
    const b = $('#checkbtn'); if (b) b.disabled = !t.value.trim();
  } else if (t.id === 'gq') {
    UI.grammarQuery = t.value;
    const q = t.value.trim().toLowerCase();
    const L = UI.grammarLevel;
    const list = q ? allLessons().filter(l => (l.title + ' ' + l.es + ' ' + l.goal + ' ' + l.theory).toLowerCase().includes(q)) : (L === 'mine' ? S.custom.lessons : levelLessons(L));
    const box = $('#lesson-list'); if (box) box.innerHTML = lessonRows(list, !!q || L === 'mine');
  } else if (t.id === 'wtext') {
    AI.write.text = t.value; const c = $('#wcount'); if (c) c.textContent = (t.value.trim().match(/\S+/g) || []).length + ' palabras';
  } else if (t.id === 'chatin') AI.chat.draft = t.value;
  else if (t.id === 'gentopic') AI.gen.topic = t.value;
  else if (t.id === 'importbox') UI.importText = t.value;
  else if (t.id === 'ds-desc') DESIGN.desc = t.value;
  else if (t.id === 'ds-text') DESIGN.text = t.value;
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'el-teacher' || t.id === 'el-native') { EL[t.id === 'el-teacher' ? 'teacher' : 'native'] = t.value; saveEL(); render(); }
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (R.name === 'quiz' && SESSION && !SESSION.finished) {
    const it = SESSION.items[SESSION.i];
    if (e.key === 'Enter' && !e.shiftKey) {
      if (tag === 'button') return;
      e.preventDefault();
      if (it.done) nextQ(); else checkCurrent();
      return;
    }
    if (!it.done && it.ex.t === 'mc' && /^[1-5]$/.test(e.key) && tag !== 'input' && tag !== 'textarea') {
      const n = Number(e.key) - 1; if (it.perm[n] != null) { SESSION.q.sel = it.perm[n]; render(); }
    }
    return;
  }
  if (R.name === 'flash' && FLASH && FLASH.i < FLASH.queue.length && tag !== 'input' && tag !== 'textarea') {
    if (!FLASH.revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); FLASH.revealed = true; render(); }
    else if (FLASH.revealed && /^[1-4]$/.test(e.key)) gradeFlash(Number(e.key));
    return;
  }
  if (R.name === 'tutor' && e.target.id === 'chatin' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); chatSend(); }
});

/* =========================================================
   Arranque
   ========================================================= */
render();
if (ttsOK) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) {} }
initCloud();
initFirebase();
initAI();
elRefreshSub();
})();

</script>
